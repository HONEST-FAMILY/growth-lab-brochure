<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#191f28">
<title>사업성장연구소 · 웹 발표자료</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#191f28;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
button,select,a{font:inherit}
button,a,select{-webkit-tap-highlight-color:transparent}
button,select,.link{min-height:44px;border:1px solid #4e5968;border-radius:9px;background:#333d4b;color:#fff;padding:9px 14px}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:hover:enabled,.link:hover{background:#4e5968}
button:focus-visible,select:focus-visible,a:focus-visible,main:focus-visible{outline:3px solid #90c2ff;outline-offset:3px}
.viewer{height:100vh;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
h1{font-size:17px;margin:0;font-weight:700}
header p{font-size:13px;color:#b0b8c1;margin:5px 0 0}
.link{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:14px}
main{flex:1;min-height:0;position:relative;background:#000;outline:none}
main img{width:100%;height:100%;object-fit:contain;display:block}
.error{position:absolute;inset:0;place-content:center;text-align:center;background:#191f28;padding:24px;line-height:1.7}
.error:not([hidden]){display:grid}
.error a{color:#90c2ff}
footer{padding:12px 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}
.controls{display:flex;align-items:center;justify-content:center;gap:9px;width:100%}
select{max-width:420px;flex:1;min-width:0}
.count{font-size:14px;color:#b0b8c1;min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:#b0b8c1;text-align:center;margin:0;line-height:1.5}
.hint a{color:inherit;margin-left:12px}
.status{margin:0;font-size:13px;color:#b0b8c1;text-align:center}
.fullscreen header,.fullscreen .hint{display:none}
@media(max-width:600px){header{padding:10px 12px}h1{font-size:15px}header p{font-size:12px;max-width:220px}.link{font-size:12px;padding:9px 10px}.controls{flex-wrap:wrap;gap:8px}.controls select{order:-1;flex-basis:calc(100% - 65px);max-width:none}.count{order:-1}footer{padding:10px 12px}.hint span{display:block}}
@media(max-height:500px){header,.hint{display:none}footer{padding:6px}.controls{flex-wrap:nowrap}.controls select{order:0;flex-basis:auto;max-width:420px}.count{order:0}}
</style>
</head>
<body>
<div class="viewer" id="viewer">
  <header>
    <div><h1>사업성장연구소</h1><p>설치 없이 바로 발표 · 기존 15장</p></div>
    <a class="link" href="deck.pdf?v=20261024restore15" download="어니스트패밀리_사업홍보발표.pdf">PDF 저장</a>
  </header>
  <main id="stage" tabindex="0" aria-label="발표 슬라이드. 좌우 방향키로 장을 넘길 수 있습니다.">
    <img id="slide" src="slides/slide-01.png?v=20261024restore15" alt="1장 회사 소개" width="1920" height="1080" draggable="false">
    <div class="error" id="error" role="alert" hidden>슬라이드를 불러오지 못했습니다.<br>인터넷 연결을 확인하거나 <a href="deck.pdf?v=20261024restore15">PDF로 열어 주세요.</a></div>
  </main>
  <footer>
    <nav class="controls" aria-label="발표 조작">
      <button id="prev" type="button" aria-label="이전 장">← 이전</button>
      <select id="pages" aria-label="슬라이드 선택"></select>
      <span class="count" id="count" aria-live="polite">1 / 15</span>
      <button id="next" type="button" aria-label="다음 장">다음 →</button>
      <button id="fullscreen" type="button" aria-pressed="false">발표 시작</button>
    </nav>
    <p class="hint"><span>← → 방향키로 이동 · 발표 종료는 Esc</span> PDF를 저장하면 인터넷 없이 열 수 있습니다.<a href="../event.html#presentation">전체 자료</a></p>
    <p class="status" id="status" role="status" hidden></p>
  </footer>
</div>
<noscript><p>발표자료는 <a href="deck.pdf?v=20261024restore15">PDF로도 열 수 있습니다.</a></p></noscript>
<script>
const titles=['회사 소개','외주 제작사로 쌓아 온 경험','출시 후에 마주한 현실','만들고 나면 그제서야 시작','여러 가설로 마케팅하기','개선하고, 다시 알리기','사업성장연구소','월 구독으로 함께 진행하는 방식','작게 시작하는 두 가지 이유','123타이어 · 구매 과정과 연매출 변화','블루프렙 · 해외 시장과 초기 성장','뽀뽀뜨 · 재구매 가설 실험','뽀뽀뜨 · 엄마의 편의를 위한 실험','지속적인 실행을 약속합니다','문의 및 마무리'];
const viewer=document.getElementById('viewer');
const stage=document.getElementById('stage');
const slide=document.getElementById('slide');
const pages=document.getElementById('pages');
const count=document.getElementById('count');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const fullscreen=document.getElementById('fullscreen');
const status=document.getElementById('status');
const error=document.getElementById('error');
let current=0;
let presenting=false;
titles.forEach((title,index)=>pages.add(new Option(`${index+1}. ${title}`,String(index))));
function slideUrl(index){return `slides/slide-${String(index+1).padStart(2,'0')}.png?v=20261024restore15`}
function show(index){
  current=Math.max(0,Math.min(titles.length-1,index));
  error.hidden=true;
  slide.src=slideUrl(current);
  slide.alt=`${current+1}장 ${titles[current]}`;
  pages.value=String(current);
  count.textContent=`${current+1} / ${titles.length}`;
  prev.disabled=current===0;
  next.disabled=current===titles.length-1;
  history.replaceState(null,'',`#${current+1}`);
}
function fromHash(){const value=Number(location.hash.slice(1));show(Number.isInteger(value)&&value>0?value-1:0)}
function isFullscreen(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement)}
function setPresenting(active){presenting=active;viewer.classList.toggle('fullscreen',active);fullscreen.textContent=active?'발표 종료':'발표 시작';fullscreen.setAttribute('aria-pressed',String(active));status.hidden=true}
function syncFullscreen(){setPresenting(isFullscreen())}
slide.addEventListener('load',()=>{error.hidden=true});
slide.addEventListener('error',()=>{error.hidden=false});
prev.addEventListener('click',()=>{show(current-1);stage.focus({preventScroll:true})});
next.addEventListener('click',()=>{show(current+1);stage.focus({preventScroll:true})});
pages.addEventListener('change',()=>{show(Number(pages.value));stage.focus({preventScroll:true})});
fullscreen.addEventListener('click',async()=>{
  if(presenting){
    if(isFullscreen()){
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
    setPresenting(false);
  }else{
    setPresenting(true);
    try{
      if(viewer.requestFullscreen)await viewer.requestFullscreen();
      else if(viewer.webkitRequestFullscreen)viewer.webkitRequestFullscreen();
      else throw new Error('fullscreen');
    }catch{
      status.textContent='브라우저의 보기 메뉴에서 전체 화면을 선택하면 주소 표시줄도 숨길 수 있습니다.';
      status.hidden=false;
    }
  }
  stage.focus({preventScroll:true});
});
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&presenting&&!isFullscreen()){setPresenting(false);stage.focus({preventScroll:true});return}
  if(event.altKey||event.ctrlKey||event.metaKey||event.target.closest('select,input,textarea,button,a'))return;
  let index=current;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key))index+=event.shiftKey&&event.key===' '?-1:1;
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key))index--;
  else if(event.key==='Home')index=0;
  else if(event.key==='End')index=titles.length-1;
  else return;
  event.preventDefault();
  show(index);
});
let touchStart=null;
stage.addEventListener('touchstart',event=>{touchStart=event.touches.length===1?{x:event.touches[0].clientX,y:event.touches[0].clientY}:null},{passive:true});
stage.addEventListener('touchend',event=>{
  if(!touchStart||event.changedTouches.length!==1)return;
  const dx=event.changedTouches[0].clientX-touchStart.x;
  const dy=event.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1));
  touchStart=null;
},{passive:true});
window.addEventListener('hashchange',fromHash);
fromHash();
titles.forEach((title,index)=>{const image=new Image();image.src=slideUrl(index)});
</script>
</body>
</html>
