<style>
:root{--blue:#3182f6;--ink:#191f28;--sub:#4e5968;--muted:#6b7684;--line:#e5e8eb}
*{box-sizing:border-box}
body{margin:0;background:#f2f4f6;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:28px 0 18px}
header .k{display:block;font-size:13px;font-weight:800;color:var(--blue)}
header h1{margin:8px 0 8px;font-size:clamp(26px,6vw,38px);line-height:1.25;letter-spacing:-.035em}
header p{margin:0;color:var(--sub);font-size:15.5px;line-height:1.6}
.how{margin:14px 0 0;padding:14px 16px;border-radius:16px;background:var(--ink);color:#fff;font-size:15px;line-height:1.55}
.how b{color:#8ec5ff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px 0 24px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
figure{margin:0;background:#fff;border-radius:16px;padding:8px 8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
figure>a{position:relative;display:block;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
figure img{display:block;width:100%;height:auto;aspect-ratio:148/210}
.no{position:absolute;right:6px;top:6px;z-index:1;min-width:40px;height:30px;padding:0 8px;border-radius:99px;background:#fff;color:var(--ink);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
@media(min-width:900px){.no{height:36px;font-size:18px;min-width:52px}}
figcaption{margin-top:9px;font-size:13.5px;line-height:1.5;color:var(--sub)}
figcaption b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px;letter-spacing:-.02em}
.pdf{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:none}
.share{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 30px}
.share a{font-size:14px;font-weight:800;text-decoration:none;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff}
.share a.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
footer{padding:0 0 40px;color:var(--muted);font-size:13px;line-height:1.6}

    <span class="k">사업성장연구소 소개 책자 · 표지 투표 6번 '큰 글씨'</span>
    <h1>6번 큰 글씨 표지,<br>변형 7가지</h1>
    <p>글자는 같고 바탕색과 글자 놓는 방식만 다릅니다. 행사장 테이블에서 멀리서 봤을 때 가장 먼저 눈에 들어오는 것을 골라 주세요.</p>
    <p class="how"><b>고르는 법</b> 번호 하나를 답장으로 보내 주세요. 예) "6-4"</p>
  </header>
  <section class="grid">
      <figure><a href="drafts/m/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-1</span><img src="drafts/m/page1.jpg?v=20261022b" alt="6-1 흰 바탕 기본 표지" loading="lazy"></a><figcaption><b>6-1. 흰 바탕 기본</b>지난번 6번 그대로. 흰 바탕에 검은 큰 글씨, 파란 물음표.<a class="pdf" href="drafts/m/growth-lab-draft-m-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
      <figure><a href="drafts/p/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-2</span><img src="drafts/p/page1.jpg?v=20261022b" alt="6-2 파랑 바탕 표지" loading="lazy"></a><figcaption><b>6-2. 파랑 바탕</b>책자 색과 같은 파랑 바탕에 흰 큰 글씨. 물음표만 검정.<a class="pdf" href="drafts/p/growth-lab-draft-p-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
      <figure><a href="drafts/q/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-3</span><img src="drafts/q/page1.jpg?v=20261022b" alt="6-3 검정 바탕 표지" loading="lazy"></a><figcaption><b>6-3. 검정 바탕</b>검정 바탕이라 테이블 위 어떤 책자보다 진하게 튑니다.<a class="pdf" href="drafts/q/growth-lab-draft-q-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
      <figure><a href="drafts/r/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-4</span><img src="drafts/r/page1.jpg?v=20261022b" alt="6-4 원고지 네 칸 표지" loading="lazy"></a><figcaption><b>6-4. 원고지 네 칸</b>'막·막·할·땐' 네 글자를 원고지처럼 한 칸에 한 글자씩.<a class="pdf" href="drafts/r/growth-lab-draft-r-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
      <figure><a href="drafts/s/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-5</span><img src="drafts/s/page1.jpg?v=20261022b" alt="6-5 큰 물음표 표지" loading="lazy"></a><figcaption><b>6-5. 큰 물음표</b>표지 전체를 채우는 물음표를 같은 파랑 계열로 깔았습니다.<a class="pdf" href="drafts/s/growth-lab-draft-s-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
      <figure><a href="drafts/t/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-6</span><img src="drafts/t/page1.jpg?v=20261022b" alt="6-6 잘린 큰 글씨 표지" loading="lazy"></a><figcaption><b>6-6. 잘린 큰 글씨</b>'막막' 두 글자를 표지보다 크게 키워 양옆이 잘리게.<a class="pdf" href="drafts/t/growth-lab-draft-t-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
      <figure><a href="drafts/u/page1.jpg?v=20261022b" target="_blank" rel="noopener"><span class="no">6-7</span><img src="drafts/u/page1.jpg?v=20261022b" alt="6-7 형광펜 표지" loading="lazy"></a><figcaption><b>6-7. 형광펜</b>'막막할'에 형광펜을 칠한 듯 연한 파랑 줄을 그었습니다.<a class="pdf" href="drafts/u/growth-lab-draft-u-A5-print.pdf?v=20261022b">8쪽 인쇄 PDF ↗</a></figcaption></figure>
